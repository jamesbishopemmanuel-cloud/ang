name: Veylora Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 3. IMPORTANT: Android/Capacitor requires Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 4. Verify Java
      - name: Check Java version
        run: |
          java -version
          javac -version

      # 5. Install project dependencies
      - name: Install dependencies
        run: npm install

      # 6. Make sure the important files exist
      - name: Verify project files
        run: |
          test -f index.html
          test -f main.js
          test -f style.css
          test -f package.json
          test -f capacitor.config.ts

      # 7. Build the Vite web application
      - name: Build Vite application
        run: npm run build

      # 8. Create Android project if it does not exist
      - name: Add Capacitor Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      # 9. Copy web application into Android project
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 10. Run tests
      - name: Run tests
        run: npm test

      # 11. Build Android Debug APK
      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # 12. Upload APK to GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veylora-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error