- name: Inspect build output
  run: |
    echo "Build output:"
    find dist -maxdepth 5 -type f -print 2>/dev/null || true

- name: Verify build
  run: |
    if [ -d dist ]; then
      echo "===================================="
      echo "Veylora backend build PASSED"
      echo "===================================="
    else
      echo "ERROR: dist directory was not created."
      exit 1
    fi