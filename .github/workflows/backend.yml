name: Veylora Backend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Build Veylora Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: veylora
          POSTGRES_PASSWORD: veylora_password
          POSTGRES_DB: veylora
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U veylora -d veylora"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://veylora:veylora_password@localhost:5432/veylora
      JWT_SECRET: github-actions-development-secret
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check project files
        run: |
          echo "Repository:"
          pwd
          ls -la
          echo "package.json:"
          cat package.json
          echo "Prisma:"
          ls -la prisma

      - name: Install dependencies
        run: npm install

      - name: Force Prisma 6
        run: npm install --save-dev prisma@6.15.0

      - name: Install matching Prisma Client
        run: npm install @prisma/client@6.15.0

      - name: Check Prisma version
        run: npx prisma --version

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Build application
        run: npm run build

      - name: Verify build
        run: |
          test -f dist/server.js
          echo "===================================="
          echo "Veylora backend build PASSED"
          echo "===================================="