name: Veylora Backend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Build and Validate Veylora Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: veylora
          POSTGRES_PASSWORD: veylora_password
          POSTGRES_DB: veylora
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U veylora -d veylora"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://veylora:veylora_password@localhost:5432/veylora
      JWT_SECRET: github-actions-development-secret
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          echo "Repository:"
          pwd
          echo ""
          echo "Root files:"
          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            | sort

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Node.js and npm
        run: |
          node --version
          npm --version

      - name: Check package.json
        run: |
          test -f package.json
          echo "package.json found."

      - name: Install dependencies
        run: npm install

      - name: Install Prisma 6
        run: |
          npm install --save-dev prisma@6.15.0
          npm install @prisma/client@6.15.0

      - name: Check Prisma version
        run: npx prisma --version

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Build application
        run: npm run build

      - name: Inspect build output
        run: |
          echo "===================================="
          echo "Build output"
          echo "===================================="

          if [ -d dist ]; then
            find dist -type f -print | sort
          else
            echo "No dist directory was created."
          fi

      - name: Verify build
        run: |
          if [ -d dist ] && [ "$(find dist -type f | wc -l)" -gt 0 ]; then
            echo "===================================="
            echo "VEY LORA BACKEND BUILD PASSED"
            echo "===================================="
          else
            echo "ERROR: Build completed but no files were generated in dist."
            exit 1
          fi