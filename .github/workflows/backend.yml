name: Veylora Backend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Build Veylora Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: veylora
          POSTGRES_PASSWORD: veylora_password
          POSTGRES_DB: veylora
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U veylora -d veylora"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://veylora:veylora_password@localhost:5432/veylora
      JWT_SECRET: github-actions-development-secret
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          echo "Current directory:"
          pwd
          echo "Repository files:"
          ls -la
          echo "Source directory:"
          ls -la src || true
          echo "Prisma directory:"
          ls -la prisma || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma
        run: npx prisma validate

      - name: Build backend
        run: npm run build

      - name: Verify build
        run: |
          test -f dist/server.js
          echo "Veylora backend build passed successfully."