name: Veylora Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:


jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Verify project structure
        run: |
          test -f package.json
          test -f index.html
          test -f src/main.js
          test -f src/style.css
          test -f capacitor.config.ts
          echo "Project files OK"


      - name: Install frontend dependencies
        run: |
          npm install
          npm install @capacitor/core@7.4.0 @capacitor/android@7.4.0 --save
          npm install @capacitor/cli@7.4.0 --save-dev


      - name: Verify Capacitor installation
        run: |
          test -d node_modules/@capacitor/core
          test -d node_modules/@capacitor/android
          test -d node_modules/@capacitor/cli
          echo "Capacitor installed successfully"


      - name: Show versions
        run: |
          node -v
          npm -v
          npx vite --version


      - name: Build Veylora Web App
        run: npm run build


      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi


      - name: Sync Capacitor Android
        run: |
          npx cap sync android


      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veylora-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: veylora-web-dist
          path: dist/