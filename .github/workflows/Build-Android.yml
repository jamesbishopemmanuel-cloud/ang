name: Build Veylora Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:


jobs:

  android-build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout code
        uses: actions/checkout@v4



      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm



      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"



      - name: Verify project files
        run: |
          set -e

          test -f package.json
          test -f index.html
          test -f src/main.js
          test -f src/style.css
          test -f capacitor.config.ts

          echo "Project files OK"



      - name: Install npm dependencies
        run: |
          npm install



      - name: Install Capacitor packages
        run: |
          npm install @capacitor/core@7.4.0
          npm install @capacitor/android@7.4.0
          npm install -D @capacitor/cli@7.4.0
          npm install -D typescript



      - name: Check Capacitor
        run: |
          npx cap --version



      - name: Build Vite web app
        run: |
          npm run build



      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi



      - name: Sync Capacitor
        run: |
          npx cap sync android



      - name: Setup Android SDK
        uses: android-actions/setup-android@v3



      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon



      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Veylora-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error