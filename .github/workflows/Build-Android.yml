
name: Veylora Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        run: |
          echo "Current folder:"
          pwd

          echo "Files:"
          find . -maxdepth 4 -type f | sort