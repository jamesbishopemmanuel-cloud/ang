
name: Veylora Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Debug Repository Structure
        run: |
          echo "========== LOCATION =========="
          pwd

          echo "========== ROOT =========="
          ls -la

          echo "========== ALL FILES =========="
          find . -maxdepth 4 -type f | sort


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Check Required Files
        run: |
          set -e

          REQUIRED_FILES="
          package.json
          index.html
          src/main.js
          src/style.css
          capacitor.config.ts
          "

          for FILE in $REQUIRED_FILES
          do
            if [ -f "$FILE" ]; then
              echo "FOUND: $FILE"
            else
              echo "MISSING: $FILE"
              exit 1
            fi
          done

          echo "All required files found"


      - name: Install NPM Dependencies
        run: |
          npm install


      - name: Install Capacitor Packages
        run: |
          npm install @capacitor/core@7.4.0
          npm install @capacitor/android@7.4.0
          npm install --save-dev @capacitor/cli@7.4.0
          npm install --save-dev typescript


      - name: Verify Capacitor
        run: |
          echo "Checking Capacitor..."

          test -d node_modules/@capacitor/core
          test -d node_modules/@capacitor/android
          test -d node_modules/@capacitor/cli

          echo "Capacitor installed successfully"


      - name: Build Web App
        run: |
          npm run build


      - name: Check Capacitor Version
        run: |
          npx cap --version


      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi


      - name: Sync Android
        run: |
          npx cap sync android


      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Veylora-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      - name: Upload Web Files
        uses: actions/upload-artifact@v4
        with:
          name: Veylora-Web-Build
          path: dist/