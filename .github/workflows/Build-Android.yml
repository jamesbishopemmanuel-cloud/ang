name: Veylora Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:


jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Show repository structure
        run: |
          echo "Current directory:"
          pwd

          echo "Files:"
          ls -la

          echo "All project files:"
          find . -maxdepth 3 -type f


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Verify required files
        run: |
          set -e

          test -f package.json
          test -f index.html
          test -f src/main.js
          test -f src/style.css
          test -f capacitor.config.ts

          echo "Project files OK"


      - name: Install dependencies
        run: |
          npm install

          npm install @capacitor/core@7.4.0
          npm install @capacitor/android@7.4.0
          npm install -D @capacitor/cli@7.4.0
          npm install -D typescript


      - name: Verify Capacitor
        run: |
          test -d node_modules/@capacitor/core
          test -d node_modules/@capacitor/android
          test -d node_modules/@capacitor/cli

          echo "Capacitor installed"


      - name: Check versions
        run: |
          node -v
          npm -v
          npx vite --version


      - name: Build Veylora web app
        run: |
          npm run build


      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi


      - name: Sync Capacitor
        run: |
          npx cap sync android


      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veylora-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: veylora-web-dist
          path: dist/