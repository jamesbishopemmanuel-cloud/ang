
name: Veylora Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Show project structure
        run: |
          echo "Current directory:"
          pwd

          echo "Root files:"
          ls -la

          echo "All files:"
          find . -maxdepth 3 -type f | sort


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install dependencies
        run: |
          npm install


      - name: Verify project files
        run: |
          set -e

          for file in \
            package.json \
            index.html \
            src/main.js \
            src/style.css \
            capacitor.config.ts
          do
            if [ ! -f "$file" ]; then
              echo "Missing file: $file"
              exit 1
            fi

            echo "Found: $file"
          done

          echo "Project files OK"


      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7.4.0
          npm install @capacitor/android@7.4.0
          npm install -D @capacitor/cli@7.4.0
          npm install -D typescript


      - name: Verify Capacitor
        run: |
          test -d node_modules/@capacitor/core
          test -d node_modules/@capacitor/android
          test -d node_modules/@capacitor/cli

          echo "Capacitor installed"


      - name: Check tools
        run: |
          node -v
          npm -v
          npx vite --version


      - name: Build web app
        run: |
          npm run build


      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi


      - name: Sync Capacitor Android
        run: |
          npx cap sync android


      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Veylora-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      - name: Upload Website Build
        uses: actions/upload-artifact@v4
        with:
          name: Veylora-web-dist
          path: dist/