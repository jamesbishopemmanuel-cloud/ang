name: Veylora Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Find project location
        id: project
        run: |
          echo "Searching for package.json..."

          PROJECT_DIR=$(dirname "$(find . -name package.json | head -1)")

          if [ "$PROJECT_DIR" = "." ]; then
            echo "Project is in root folder"
            echo "path=." >> $GITHUB_OUTPUT
          else
            echo "Project found in: $PROJECT_DIR"
            echo "path=$PROJECT_DIR" >> $GITHUB_OUTPUT
          fi


      - name: Show files
        run: |
          echo "Repository files:"
          find . -maxdepth 4 -type f | sort


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          npm install


      - name: Verify project files
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          set -e

          test -f package.json
          test -f index.html
          test -f src/main.js
          test -f src/style.css
          test -f capacitor.config.ts

          echo "Project files OK"


      - name: Install Capacitor
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          npm install @capacitor/core@7.4.0
          npm install @capacitor/android@7.4.0
          npm install -D @capacitor/cli@7.4.0
          npm install -D typescript


      - name: Verify Capacitor
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          test -d node_modules/@capacitor/core
          test -d node_modules/@capacitor/android
          test -d node_modules/@capacitor/cli

          echo "Capacitor installed"


      - name: Build Veylora Web
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          npm run build


      - name: Check Capacitor
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          npx cap --version


      - name: Add Android
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi


      - name: Sync Android
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          npx cap sync android


      - name: Build APK
        working-directory: ${{ steps.project.outputs.path }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Veylora-debug-apk
          path: "**/android/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error


      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: Veylora-web-dist
          path: "**/dist/**"