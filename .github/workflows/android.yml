name: Veylora Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Veylora Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify project files
        shell: bash
        run: |
          set -e

          echo "Checking Veylora project..."

          test -f package.json
          test -f index.html
          test -f capacitor.config.js
          test -f src/main.js
          test -f src/style.css

          echo "All required files found."

      - name: Install dependencies
        run: npm install

      - name: Verify Capacitor installation
        shell: bash
        run: |
          set -e

          test -d node_modules/@capacitor/core
          test -d node_modules/@capacitor/android
          test -d node_modules/@capacitor/cli

          echo "Capacitor packages installed."

          node node_modules/@capacitor/cli/bin/capacitor --version

      - name: Build web application
        run: npm run build

      - name: Create Android platform
        shell: bash
        run: |
          set -e

          if [ ! -d android ]; then
            echo "Android platform does not exist. Creating it..."
            node node_modules/@capacitor/cli/bin/capacitor add android
          else
            echo "Android platform already exists."
          fi

      - name: Sync Capacitor
        run: |
          node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "APK files found:"
          find android/app/build/outputs/apk -type f -name "*.apk" -print

          test -n "$(find android/app/build/outputs/apk -type f -name "*.apk" -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veylora-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: veylora-web-dist
          path: dist/
          if-no-files-found: error