name: Veylora Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:

  android-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21


      - name: Install dependencies
        run: |
          npm install


      - name: Build web app
        run: |
          npm run build


      - name: Install Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android


      - name: Check Capacitor config
        run: |

          if [ -f capacitor.config.ts ] || [ -f capacitor.config.json ]; then
            echo "Capacitor config found"
          else
            echo "Capacitor config missing"
            exit 1
          fi


      - name: Remove old Android folder
        run: |

          if [ -d android ]; then
            echo "Removing incomplete Android folder"
            rm -rf android
          fi


      - name: Create fresh Android project
        run: |

          echo "Creating Android project..."

          npx cap add android


      - name: Sync Android
        run: |

          npx cap sync android


      - name: Check Android files
        run: |

          echo "Checking Android project..."

          ls -la android

          test -f android/gradlew

          chmod +x android/gradlew

          echo "Android project ready"


      - name: Build APK
        working-directory: android
        run: |

          ./gradlew assembleDebug --no-daemon


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:

          name: Veylora-debug-apk

          path: android/app/build/outputs/apk/debug/app-debug.apk