name: Build Veylora Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      - name: Install dependencies
        run: |
          npm install


      - name: Build web app
        run: |
          npm run build


      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli


      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            echo "Android folder missing. Creating..."
            npx cap add android
          else
            echo "Android folder exists."
          fi


      - name: Sync Capacitor Android
        run: |
          npx cap sync android


      - name: Check Android project
        run: |
          test -d android
          test -f android/gradlew
          echo "Android project found."


      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21


      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Veylora-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk