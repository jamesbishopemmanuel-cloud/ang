name: Veylora Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Veylora Android APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # NODE
      # ---------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ---------------------------------------------------------
      # JAVA
      # ---------------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ---------------------------------------------------------
      # VERIFY PROJECT
      # ---------------------------------------------------------

      - name: Show project files
        run: |
          echo "========================================"
          echo "VEY LORA PROJECT"
          echo "========================================"

          pwd

          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "Source files:"
          if [ -d src ]; then
            find src -maxdepth 2 -type f -print
          fi

          echo ""
          echo "Workflow files:"
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f -print
          fi

      - name: Verify required files
        run: |
          set -e

          test -f package.json
          test -f index.html
          test -f src/main.js
          test -f src/style.css

          echo "Required web files found."

      # ---------------------------------------------------------
      # CAPACITOR CONFIG
      # ---------------------------------------------------------

      - name: Prepare Capacitor configuration
        run: |
          set -e

          # Use JavaScript configuration so Capacitor does not
          # require TypeScript merely to read the config.

          if [ -f capacitor.config.js ]; then
            echo "capacitor.config.js found."
          else
            if [ -f capacitor.config.ts ]; then
              echo "capacitor.config.ts found."
              echo "The workflow will use capacitor.config.js instead."
              rm -f capacitor.config.ts
            fi

            cat > capacitor.config.js <<'EOF'
          const config = {
            appId: "com.veylora.app",
            appName: "Veylora",
            webDir: "dist",
            bundledWebRuntime: false
          };

          module.exports = config;
          EOF
          fi

          echo ""
          echo "Capacitor configuration:"
          cat capacitor.config.js

      # ---------------------------------------------------------
      # INSTALL
      # ---------------------------------------------------------

      - name: Install dependencies
        run: |
          set -e

          npm install

      # ---------------------------------------------------------
      # VERIFY CAPACITOR
      # ---------------------------------------------------------

      - name: Verify Capacitor installation
        run: |
          set -e

          test -d node_modules/@capacitor/core
          test -d node_modules/@capacitor/android
          test -d node_modules/@capacitor/cli

          echo "Capacitor packages installed."

          node node_modules/@capacitor/cli/bin/capacitor --version

      # ---------------------------------------------------------
      # BUILD WEB APPLICATION
      # ---------------------------------------------------------

      - name: Build Veylora web application
        run: |
          set -e

          npm run build

          test -d dist
          test -f dist/index.html

          echo ""
          echo "Web build completed."

          find dist -maxdepth 2 -type f -print

      # ---------------------------------------------------------
      # CREATE ANDROID PLATFORM
      # ---------------------------------------------------------

      - name: Add Android platform
        run: |
          set -e

          if [ ! -d android ]; then
            node node_modules/@capacitor/cli/bin/capacitor add android
          else
            echo "Android platform already exists."
          fi

          test -d android
          test -f android/gradlew

      # ---------------------------------------------------------
      # CAPACITOR SYNC
      # ---------------------------------------------------------

      - name: Sync web application with Android
        run: |
          set -e

          node node_modules/@capacitor/cli/bin/capacitor sync android

      # ---------------------------------------------------------
      # GRADLE PERMISSION
      # ---------------------------------------------------------

      - name: Prepare Gradle
        run: |
          set -e

          chmod +x android/gradlew

          test -x android/gradlew

          echo "Gradle wrapper ready."

      # ---------------------------------------------------------
      # TESTS
      # ---------------------------------------------------------

      - name: Run tests
        run: |
          set -e

          npm test

      # ---------------------------------------------------------
      # BUILD DEBUG APK
      # ---------------------------------------------------------

      - name: Build debug APK
        working-directory: android
        run: |
          set -e

          ./gradlew assembleDebug --no-daemon --stacktrace

      # ---------------------------------------------------------
      # VERIFY APK
      # ---------------------------------------------------------

      - name: Verify APK
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find android/app/build/outputs -type f -name "*.apk" -print

          test -n "$(find android/app/build/outputs -type f -name '*.apk' -print -quit)"

          echo ""
          echo "APK successfully created."

      # ---------------------------------------------------------
      # UPLOAD APK
      # ---------------------------------------------------------

      - name: Upload Veylora APK
        uses: actions/upload-artifact@v4
        with:
          name: veylora-android-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # UPLOAD WEB BUILD
      # ---------------------------------------------------------

      - name: Upload Veylora web build
        uses: actions/upload-artifact@v4
        with:
          name: veylora-web-dist
          path: |
            dist/
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # UPLOAD ANDROID BUILD INFORMATION
      # ---------------------------------------------------------

      - name: Upload Android build folder
        uses: actions/upload-artifact@v4
        with:
          name: veylora-android-build
          path: |
            android/app/build/outputs/
          if-no-files-found: error
          retention-days: 30