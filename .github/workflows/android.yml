name: Veylora Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Show project
        run: |
          pwd
          ls -la
          echo "----- package.json -----"
          cat package.json

      - name: Install dependencies
        run: |
          npm install
          npm install --save @capacitor/core@7.4.0 @capacitor/android@7.4.0
          npm install --save-dev @capacitor/cli@7.4.0

      - name: Verify Capacitor CLI
        run: |
          test -d node_modules/@capacitor/cli
          test -f node_modules/@capacitor/cli/bin/capacitor
          node node_modules/@capacitor/cli/bin/capacitor --version

      - name: Verify required files
        run: |
          test -f package.json
          test -f index.html
          test -f src/main.js
          test -f src/style.css
          test -f capacitor.config.js

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            node node_modules/@capacitor/cli/bin/capacitor add android
          fi

      - name: Sync Capacitor
        run: |
          node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Prepare Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veylora-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: veylora-web-dist
          path: dist/
          if-no-files-found: error