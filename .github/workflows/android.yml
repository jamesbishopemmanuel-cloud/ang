name: Build Veylora Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:

  build-android:

    runs-on: ubuntu-latest


    steps:

      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4



      # Node setup
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22



      # Java for Android
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21



      # Install packages
      - name: Install dependencies
        run: |
          npm install



      # Build Veylora web app
      - name: Build web app
        run: |
          npm run build



      # Install Capacitor
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android



      # Check Capacitor config
      - name: Check Capacitor config
        run: |

          if [ -f capacitor.config.ts ]; then
            echo "Found capacitor.config.ts"

          elif [ -f capacitor.config.json ]; then
            echo "Found capacitor.config.json"

          else
            echo "Missing Capacitor config"
            exit 1

          fi



      # Remove broken Android folder and recreate
      - name: Recreate Android project
        run: |

          if [ -d android ]; then

            echo "Removing old Android folder..."

            rm -rf android

          fi


          echo "Creating fresh Android project..."

          npx cap add android



      # Sync files
      - name: Sync Capacitor Android
        run: |

          npx cap sync android



      # Verify Android
      - name: Verify Android project
        run: |

          echo "Checking Android files..."

          ls -la android

          test -f android/gradlew

          chmod +x android/gradlew

          echo "Android project ready"



      # Build APK
      - name: Build APK
        working-directory: android
        run: |

          ./gradlew assembleDebug --no-daemon



      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:

          name: Veylora-debug-apk

          path: android/app/build/outputs/apk/debug/app-debug.apk