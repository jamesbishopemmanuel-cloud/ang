name: Veylora Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # Creates package-lock.json automatically if missing
      - name: Install dependencies
        run: |
          npm install
          test -f package-lock.json
          echo "package-lock.json created successfully"


      - name: Verify project files
        run: |
          test -f package.json
          test -f index.html
          test -f src/main.js
          test -f src/style.css
          test -f capacitor.config.ts
          echo "Required files found"


      - name: Check Capacitor
        run: |
          test -d node_modules/@capacitor/core
          test -d node_modules/@capacitor/android
          test -d node_modules/@capacitor/cli
          echo "Capacitor installed"


      - name: Build Web App
        run: npm run build


      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi


      - name: Sync Capacitor
        run: npx cap sync android


      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veylora-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: veylora-web-dist
          path: dist/