- name: Check Capacitor setup
  run: |
    ls -la
    test -f capacitor.config.ts || test -f capacitor.config.json
    echo "Capacitor config found"


- name: Install Capacitor Android
  run: |
    npm install @capacitor/android


- name: Create Android project
  run: |

    if [ ! -d android ]; then

      echo "Android folder not found"

      npx cap add android

    else

      echo "Android folder already exists"

    fi


- name: Sync Android
  run: |
    npx cap sync android


- name: Verify Android
  run: |

    ls -la

    ls -la android

    test -d android

    test -f android/gradlew

    echo "Android project found successfully"