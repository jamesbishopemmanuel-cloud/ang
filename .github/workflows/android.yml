name: Veylora Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Veylora Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Show environment
        run: |
          node --version
          npm --version
          java -version

      - name: Verify project files
        run: |
          set -e

          test -f package.json
          test -f index.html
          test -f src/main.js
          test -f src/style.css
          test -f capacitor.config.js

          if [ -f capacitor.config.ts ]; then
            echo "ERROR: capacitor.config.ts still exists."
            echo "Delete capacitor.config.ts and keep capacitor.config.js only."
            exit 1
          fi

          echo "Required files found."

      - name: Install dependencies
        run: npm install

      - name: Verify Capacitor installation
        run: |
          set -e

          test -d node_modules/@capacitor/core
          test -d node_modules/@capacitor/android
          test -d node_modules/@capacitor/cli
          test -d node_modules/typescript

          echo "Capacitor packages installed."
          echo "TypeScript installed."

      - name: Check Capacitor CLI
        run: |
          set -e
          node node_modules/@capacitor/cli/bin/capacitor --version

      - name: Build Veylora web application
        run: npm run build

      - name: Verify web build
        run: |
          set -e
          test -d dist
          test -f dist/index.html
          echo "Vite build completed successfully."

      - name: Prepare Android platform
        run: |
          set -e

          if [ ! -d android ]; then
            echo "Android platform does not exist."
            npx cap add android
          else
            echo "Android platform already exists."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Android project
        run: |
          set -e

          test -d android
          test -f android/gradlew

          chmod +x android/gradlew

          echo "Android project is ready."

      - name: Run tests
        run: npm test

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK created:"
          echo "$APK"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veylora-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: veylora-web-dist
          path: dist/
          if-no-files-found: error