name: Veylora Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Build Veylora Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Java
        run: |
          java -version
          javac -version

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Force Android Java 17
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("android/gradle.properties"),
              Path("android/app/build.gradle"),
              Path("android/build.gradle")
          ]

          for path in files:
              if path.exists():
                  text = path.read_text()

                  text = text.replace(
                      "JavaVersion.VERSION_21",
                      "JavaVersion.VERSION_17"
                  )

                  text = text.replace(
                      "JavaLanguageVersion.of(21)",
                      "JavaLanguageVersion.of(17)"
                  )

                  text = text.replace(
                      "jvmTarget = '21'",
                      "jvmTarget = '17'"
                  )

                  text = text.replace(
                      'jvmTarget = "21"',
                      'jvmTarget = "17"'
                  )

                  text = text.replace(
                      "sourceCompatibility = 21",
                      "sourceCompatibility = 17"
                  )

                  text = text.replace(
                      "targetCompatibility = 21",
                      "targetCompatibility = 17"
                  )

                  path.write_text(text)
          PY

      - name: Check Android Java configuration
        run: |
          echo "Searching Android project for Java 21 configuration:"
          grep -RniE "VERSION_21|JavaLanguageVersion.of\(21\)|jvmTarget.*21|sourceCompatibility.*21|targetCompatibility.*21" android \
            --exclude-dir=.gradle \
            || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Clean Android build
        working-directory: android
        run: ./gradlew clean --no-daemon

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "APK files:"
          find android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veylora-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30