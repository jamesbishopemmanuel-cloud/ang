name: Build Veylora Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Veylora Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show project
        run: |
          pwd
          echo "Root files:"
          ls -la

      - name: Install frontend dependencies
        run: |
          npm install
          npm install socket.io-client@4.8.1 --save

      - name: Verify Socket.IO
        run: |
          npm ls socket.io-client

      - name: Build web application
        run: npm run build

      - name: Install Capacitor CLI
        run: |
          npx cap --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Android project
        run: |
          echo "Checking Android project..."

          if [ -d android ]; then
            echo "Existing android directory found."

            if [ ! -f android/gradlew ]; then
              echo "Existing Android project is incomplete."
              echo "Removing incomplete Android directory..."
              rm -rf android
            fi
          fi

          if [ ! -d android ]; then
            echo "Creating a complete Capacitor Android project..."
            npx cap add android
          fi

          echo "Android directory:"
          ls -la android

          echo "Checking Gradle wrapper..."

          if [ ! -f android/gradlew ]; then
            echo "ERROR: Capacitor did not create android/gradlew."
            find android -maxdepth 5 -type f | sort
            exit 1
          fi

          chmod +x android/gradlew

          echo "Gradle wrapper successfully created."

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify Android project
        run: |
          test -d android
          test -d android/app
          test -f android/gradlew

          echo "Android project is complete."

          ls -la android
          ls -la android/gradle/wrapper || true

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find android/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

      - name: Verify APK
        run: |
          APK_COUNT=$(find android/app/build/outputs \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veylora-debug-apk
          path: android/app/build/outputs/**/*.apk
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "========================================"
          echo "VEY LORA ANDROID BUILD SUCCESSFUL"
          echo "========================================"

          find android/app/build/outputs \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;