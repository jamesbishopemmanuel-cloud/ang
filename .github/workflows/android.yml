name: Veylora Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Build Veylora Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Check Java
        run: |
          java -version
          javac -version

      - name: Install npm dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Verify web build
        run: |
          if [ ! -d dist ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          echo "Web build successful."
          find dist -maxdepth 3 -type f -print

      - name: Check Capacitor
        run: npx cap --version

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Check Android project
        run: |
          test -d android
          test -f android/gradlew
          echo "Android project found."

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Show Java and Gradle versions
        working-directory: android
        run: |
          java -version
          ./gradlew --version

      - name: Clean Android project
        working-directory: android
        run: ./gradlew clean --no-daemon

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        run: |
          echo "===================================="
          echo "APK FILES"
          echo "===================================="

          find android -type f -name "*.apk" -print

      - name: Verify APK exists
        run: |
          APK_COUNT=$(find android/app/build/outputs/apk/debug -type f -name "*.apk" 2>/dev/null | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK generated successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veylora-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30