name: Veylora Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the Veylora source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Install Java for Android/Gradle
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # 4. Install Veylora dependencies
      - name: Install dependencies
        run: |
          npm install

      # 5. Build the web application
      - name: Build web application
        run: |
          npm run build

      # 6. Install Capacitor
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # 7. Remove incomplete Android project
      - name: Remove incomplete Android project
        run: |
          if [ -d android ]; then
            echo "Removing incomplete Android project..."
            rm -rf android
          fi

      # 8. Create a complete Android project
      - name: Create Android project
        run: |
          echo "Creating Android project..."

          npx cap add android

          echo "Android project created."

      # 9. Synchronize Veylora with Android
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # 10. Check generated Android project
      - name: Verify Android project
        run: |
          echo "Checking generated Android project..."

          test -d android
          test -d android/app
          test -f android/gradlew
          test -f android/settings.gradle

          chmod +x android/gradlew

          echo "===================================="
          echo "Android project created successfully"
          echo "===================================="

          ls -la android

      # 11. Build debug APK
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 12. Check APK
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "===================================="
          echo "Veylora APK BUILD SUCCESSFUL"
          echo "===================================="

          ls -lh "$APK"

      # 13. Upload APK to GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Veylora-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error