name: Veylora Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Show project files
        run: |
          echo "Project root:"
          pwd
          echo ""
          echo "Files:"
          find . -maxdepth 4 -type f | sort

      - name: Remove old TypeScript Capacitor config
        run: |
          rm -f capacitor.config.ts
          rm -f capacitor.config.mts
          rm -f capacitor.config.cts

          find . -type f \
            \( -name "capacitor.config.ts" \
            -o -name "capacitor.config.mts" \
            -o -name "capacitor.config.cts" \) \
            -delete

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core@7.4.0 @capacitor/android@7.4.0
          npm install -D @capacitor/cli@7.4.0

      - name: Create Capacitor JavaScript config
        run: |
          cat > capacitor.config.js <<'EOF'
          const config = {
            appId: "com.veylora.app",
            appName: "Veylora",
            webDir: "dist",
            server: {
              androidScheme: "https"
            },
            android: {
              allowMixedContent: true
            }
          };

          export default config;
          EOF

      - name: Verify Capacitor configuration
        run: |
          test -f capacitor.config.js
          test ! -f capacitor.config.ts

          echo "Capacitor configuration:"
          cat capacitor.config.js

      - name: Verify required files
        run: |
          test -f package.json
          test -f index.html
          test -f src/main.js
          test -f src/style.css
          test -f capacitor.config.js

      - name: Verify Capacitor CLI
        run: |
          test -d node_modules/@capacitor/cli
          node node_modules/@capacitor/cli/bin/capacitor --version

      - name: Build Veylora web application
        run: npm run build

      - name: Create Android platform
        run: |
          if [ ! -d android ]; then
            node node_modules/@capacitor/cli/bin/capacitor add android
          fi

      - name: Sync Capacitor
        run: |
          node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Prepare Gradle
        working-directory: android
        run: |
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          find android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(find android/app/build/outputs/apk/debug -type f -name '*.apk')"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veylora-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: veylora-web-dist
          path: dist/
          if-no-files-found: error