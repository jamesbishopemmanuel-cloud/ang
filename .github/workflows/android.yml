name: Veylora Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core@7.4.0
          npm install @capacitor/cli@7.4.0 --save-dev
          npm install @capacitor/android@7.4.0


      - name: Check project files
        run: |
          test -f index.html
          test -f package.json
          test -f capacitor.config.ts
          test -f src/main.js
          test -f src/style.css


      - name: Check Capacitor
        run: |
          npx cap --version


      - name: Build Veylora Web App
        run: |
          npm run build


      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi


      - name: Sync Capacitor
        run: |
          npx cap sync android


      - name: Run tests
        run: |
          npm test || true


      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:

          name: veylora-debug-apk

          path:
            android/app/build/outputs/apk/debug/*.apk

          if-no-files-found: error


      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:

          name: veylora-web-dist

          path:
            dist/