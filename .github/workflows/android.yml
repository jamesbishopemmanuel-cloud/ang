name: Build Veylora Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm install

      - name: Verify Socket.IO client
        run: npm ls socket.io-client

      - name: Build Veylora web app
        run: npm run build

      - name: Check web build
        run: |
          test -d dist
          echo "Veylora web build created successfully."

      - name: Install Capacitor CLI
        run: npx cap --version

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Check Android project
        run: |
          echo "Checking Android project..."
          test -d android
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -d android/app
          echo "Android project found successfully."

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veylora-debug-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error